[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/contact-us"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact-us/"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/"
  status = 301

[[redirects]]
  from = "/privacy-and-cookies-policy"
  to = "/"
  status = 301

[[redirects]]
  from = "/privacy-and-cookies-policy/"
  to = "/"
  status = 301
